# Font Configuration
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window Appearance
background_opacity       0.80
hide_window_decorations  yes
window_padding_width     4

# Wayland Specifics
linux_display_server     wayland

# Theme (Loads the file you just downloaded)
include mocha.conf

# Custom Color Overrides (Pure black background, white cursor)
background #000000
cursor     #ffffff
